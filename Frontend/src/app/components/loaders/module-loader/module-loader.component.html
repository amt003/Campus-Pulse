<div class="module-loader-container">
  @if (isSkeletonVisible()) {
    <div
      class="module-skeleton-wrapper"
      role="status"
      aria-live="polite"
      [attr.aria-label]="label"
    >
      <span class="sr-only">{{ label }}</span>

      <!-- Top Status Header with Spinner & Label -->
      <div class="skeleton-top-bar">
        <div class="skeleton-header-left">
          <div class="skeleton-pulse skeleton-title-bar"></div>
          <div class="skeleton-pulse skeleton-subtitle-bar"></div>
        </div>

        <div class="skeleton-header-right">
          @if (!error && !isTimedOut()) {
            <div class="inline-spinner-indicator">
              <span class="module-mini-spinner" aria-hidden="true"></span>
              <span class="module-status-label">{{ label }}</span>
            </div>
          }
        </div>
      </div>

      <!-- Timeout or Error State Overrides -->
      @if (error) {
        <div class="module-feedback-card module-error-card">
          <span class="material-symbols-outlined feedback-icon">error_outline</span>
          <div class="feedback-text">
            <strong>Unable to load content</strong>
            <p>{{ error }}</p>
          </div>
          <button type="button" class="btn-module-retry" (click)="onRetryClick()">
            <span class="material-symbols-outlined">refresh</span>
            <span>Retry</span>
          </button>
        </div>
      } @else if (isTimedOut()) {
        <div class="module-feedback-card module-timeout-card">
          <span class="material-symbols-outlined feedback-icon">schedule</span>
          <div class="feedback-text">
            <strong>Taking longer than usual.</strong>
            <p>The system is still trying to retrieve the latest data.</p>
          </div>
          <button type="button" class="btn-module-retry" (click)="onRetryClick()">
            <span class="material-symbols-outlined">refresh</span>
            <span>Retry</span>
          </button>
        </div>
      }

      <!-- Three Summary Cards Placeholder -->
      <div class="skeleton-cards-grid" aria-hidden="true">
        <div class="skeleton-card skeleton-pulse delay-1">
          <div class="card-icon-placeholder"></div>
          <div class="card-content-placeholder">
            <div class="card-label-bar"></div>
            <div class="card-value-bar"></div>
          </div>
        </div>

        <div class="skeleton-card skeleton-pulse delay-2">
          <div class="card-icon-placeholder"></div>
          <div class="card-content-placeholder">
            <div class="card-label-bar"></div>
            <div class="card-value-bar"></div>
          </div>
        </div>

        <div class="skeleton-card skeleton-pulse delay-3">
          <div class="card-icon-placeholder"></div>
          <div class="card-content-placeholder">
            <div class="card-label-bar"></div>
            <div class="card-value-bar"></div>
          </div>
        </div>
      </div>

      <!-- Four Table Rows Placeholder -->
      <div class="skeleton-table-wrapper" aria-hidden="true">
        <div class="skeleton-table-header">
          <div class="col-placeholder col-sm"></div>
          <div class="col-placeholder col-lg"></div>
          <div class="col-placeholder col-md"></div>
          <div class="col-placeholder col-sm"></div>
        </div>

        <div class="skeleton-table-row skeleton-pulse delay-2">
          <div class="col-placeholder col-sm"></div>
          <div class="col-placeholder col-lg"></div>
          <div class="col-placeholder col-md"></div>
          <div class="col-placeholder col-sm"></div>
        </div>

        <div class="skeleton-table-row skeleton-pulse delay-3">
          <div class="col-placeholder col-sm"></div>
          <div class="col-placeholder col-lg"></div>
          <div class="col-placeholder col-md"></div>
          <div class="col-placeholder col-sm"></div>
        </div>

        <div class="skeleton-table-row skeleton-pulse delay-4">
          <div class="col-placeholder col-sm"></div>
          <div class="col-placeholder col-lg"></div>
          <div class="col-placeholder col-md"></div>
          <div class="col-placeholder col-sm"></div>
        </div>

        <div class="skeleton-table-row skeleton-pulse delay-5">
          <div class="col-placeholder col-sm"></div>
          <div class="col-placeholder col-lg"></div>
          <div class="col-placeholder col-md"></div>
          <div class="col-placeholder col-sm"></div>
        </div>
      </div>
    </div>
  } @else {
    <!-- Real Content with Smooth Fade-in -->
    <div class="module-content-rendered">
      <ng-content></ng-content>
    </div>
  }
</div>
