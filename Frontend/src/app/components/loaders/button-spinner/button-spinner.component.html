<span
  class="btn-spinner-host"
  [class.is-loading]="isSpinnerActive()"
  [attr.role]="isSpinnerActive() ? 'status' : null"
  [attr.aria-live]="isSpinnerActive() ? 'polite' : null"
>
  @if (isSpinnerActive()) {
    <span class="sr-only">Loading...</span>
    <span class="btn-spinner-circle" aria-hidden="true"></span>
  }

  <span class="btn-content-slot" [class.invisible-slot]="isSpinnerActive() && !loadingText">
    @if (isSpinnerActive() && loadingText) {
      <span>{{ loadingText }}</span>
    } @else {
      @if (text) {
        <span>{{ text }}</span>
      } @else {
        <ng-content></ng-content>
      }
    }
  </span>
</span>
